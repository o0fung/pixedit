[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixedit"
dynamic = ["version"]
description = "PixEdit is a layered desktop image editor launched with the pix command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PixEdit contributors" }]
keywords = ["image", "editor", "pyqt6", "layers", "photoshop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "PyQt6>=6.6",
    "Pillow>=10.0",
    "numpy>=1.24",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pix = "pixedit.cli:main"

# Third-party and in-repo plugins are discovered from this group.
# The callable must be `register(api)`.
[project.entry-points."pixedit.plugins"]
basic = "pixedit.plugins.examples.basic:register"

[tool.setuptools.dynamic]
version = { attr = "pixedit.__version__" }

[tool.setuptools.packages.find]
include = ["pixedit*"]

[tool.setuptools.package-data]
pixedit = ["resources/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
